services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mashgin_checkout
      MYSQL_USER: mashgin
      MYSQL_PASSWORD: mashgin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: